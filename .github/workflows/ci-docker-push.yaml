name: CI Docker Build & Push

on:
  push:
    branches:
      - lab-trivy

jobs:
  docker:
    runs-on: ubuntu-latest

    #environment: dev

    env:
      IMAGE_NAME: ci-html-demo
      IMAGE_TAG: latest
      DOCKER_REGISTRY: moisawade

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      
      - name: Test Varibales
        run: |
          echo "Varibale MYVAR  ${{ vars.MYVAR }} "
          echo "Varibale IMAGE_NAME $IMAGE_NAME"
          echo "Varibale DOCKER_REGISTRY  $DOCKER_REGISTRY "


      - name: Connexion à Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build de l’image Docker
        run: |
          docker build -t $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
        
      - name: Test de l’image Docker
        run: |
          docker image ls $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG 

      - name: Push de l’image Docker
        run: |
          docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

        ## Trivy Vulnerability Scanner 
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          format: table
          #severity: CRITICAL,HIGH, MEDIUM
          #exit-code: 1
          vuln-type: os,library
          #ignore-unfixed: true

  test-runner:
    runs-on: runner-isi
    steps:
      - name: Print hostname
        run: |
          echo "Hostname: $(hostname)"
