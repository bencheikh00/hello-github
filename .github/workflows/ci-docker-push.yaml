name: CI Docker Build & Push

env:
  IMAGE_NAME: ci-html-demo
  IMAGE_TAG: latest
  DOCKER_REGISTRY: moisawade

on:
  push:
    branches:
      - lab-deploy

jobs:
  docker:
    runs-on: ubuntu-latest

#    env:
#      IMAGE_NAME: ci-html-demo
#      IMAGE_TAG: latest
#      DOCKER_REGISTRY: moisawade

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      
      - name: Test Varibales
        run: |
          echo Varibale IMAGE_NAME= ${{ env.IMAGE_NAME }}
          echo Varibale DOCKER_REGISTRY=  ${{ env.DOCKER_REGISTRY }} 
          echo DOCKER_HUB_REGISTRY= ${{ vars.DOCKER_HUB_REGISTRY}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

#      - name: Connexion à Docker Hub
#        run: |
#          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
#
#      - name: Build de l’image Docker
#        run: |
#          docker build -t $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
#        
#      - name: Test de l’image Docker
#        run: |
#          docker image ls $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG 
#
#      - name: Push de l’image Docker
#        run: |
#          docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Run du container
        run: |
          docker run -d -p 80:8080 $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG